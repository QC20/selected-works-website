<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Notepad</title>
		<style>
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				border: 0;
				overflow: hidden;
			}
		</style>
		<link href="../../lib/os-gui/layout.css" rel="stylesheet" type="text/css">
		<link href="../../lib/os-gui/windows-98.css" rel="stylesheet" type="text/css">
		<link href="../../font/fixedsys-excelsior/fsex300.css" rel="stylesheet" type="text/css">
		<link rel="icon" href="../../images/icons/notepad-16x16.png" sizes="16x16" type="image/png">
		<link rel="icon" href="../../images/icons/notepad-32x32.png" sizes="32x32" type="image/png">
		<link rel="icon" href="../../images/icons/notepad-48x48.png" sizes="48x48" type="image/png">
		<meta name="viewport" content="width=device-width, user-scalable=no">
	</head>
	<body>
		<div id="app">
			<div id="document" class="inset-shallow">
				<textarea id="document-textarea"></textarea>
			</div>
		</div>
		<div id="print-helper"></div>
		<script src="../../lib/jquery.min.js"></script>
		<script src="../../lib/browserfs.js"></script>
		<script src="../../src/filesystem-setup.js"></script>
		<!-- PORTFOLIO ADDITION: shared-gallery helpers (see gallery-bridge.js). -->
		<script src="../../src/gallery-bridge.js"></script>
		<script src="../../src/helpers.js"></script>
		<script src="../../lib/os-gui/MenuBar.js"></script>
		<script src="../../lib/os-gui/$Window.js"></script>
		<script src="../../src/msgbox.js"></script>
		<script>defaultMessageBoxTitle = "Notepad";</script>
		<script src="lib/moment.js"></script>
		<script src="lib/FileSaver.js"></script>
		<!-- PORTFOLIO ADDITION: the Open / Save As file boxes. Must load before
		     app.js, which calls into them. -->
		<script src="src/file-dialogs.js"></script>
		<script src="src/app.js"></script>
		<script src="src/menus.js"></script>
		<style>
			#app {
				background: var(--ButtonFace);
				display: flex;
				flex-direction: column;
			}
			#document-textarea {
				width: 100%;
				height: 100%;
				resize: none;
				outline: none;
				overflow: scroll;
				padding: 0;
				border: 0;
				white-space: pre;
				padding: 2px;
				box-sizing: border-box;
				cursor: auto; /* fix scrollbar cursor (https://stackoverflow.com/a/59244343/2624876) */
			}
			#document-textarea,
			#print-helper {
				font-family: "Fixedsys Excelsior", "FixedSys", monospace;
				font-size: 16px; /* NOTE: FixedSys should be 15px, but Fixedsys Excelsior is 16px */
			}
			#document-textarea {
				background: var(--Window);
				color: var(--WindowText);
			}
			#print-helper {
				background: white;
				color: black;
			}
			html,
			body,
			#app,
			#document {
				box-sizing: border-box;
				padding: 0;
				margin: 0;
			}
			@media not print {
				#print-helper {
					display: none;
				}
				html,
				body,
				#app,
				#document {
					width: 100%;
					height: 100%;
					display: flex;
					flex-direction: column;
				}
			}
			/* PORTFOLIO ADDITION: the Open / Save As file boxes (file-dialogs.js). */
			.file-dialog {
				display: flex;
				flex-direction: column;
				gap: 8px;
				padding: 10px;
				font-family: "MS Sans Serif", Arial, sans-serif;
				font-size: 12px;
				/* Notepad's window can be short — smaller than this dialog would
				   like to be. Capping the form here and letting the file list be
				   the part that gives way keeps the Save and Cancel buttons on
				   screen at any window size. */
				box-sizing: border-box;
				max-height: calc(100vh - 44px);
			}
			.file-dialog .fd-row {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.file-dialog .fd-label {
				width: 84px;
				flex-shrink: 0;
				text-align: right;
			}
			.file-dialog .fd-select,
			.file-dialog .fd-input {
				flex: 1;
				min-width: 0;
				font-family: inherit;
				font-size: inherit;
				padding: 2px 3px;
			}
			.file-dialog .fd-list {
				/* Preferred height, but flex-shrink lets it give way first. */
				height: 150px;
				flex: 1 1 150px;
				min-height: 44px;
				overflow: auto;
				background: var(--Window, #fff);
				padding: 2px;
			}
			.file-dialog .fd-item {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 2px 4px;
				cursor: default;
				-webkit-user-select: none;
				user-select: none;
			}
			.file-dialog .fd-item.selected {
				background: var(--Highlight, #000080);
				color: var(--HighlightText, #fff);
			}
			.file-dialog .fd-empty {
				margin: 0;
				padding: 6px;
				color: var(--GrayText, #808080);
			}
			.file-dialog .fd-buttons {
				display: flex;
				justify-content: flex-end;
				gap: 6px;
				margin-top: 2px;
			}
			.file-dialog .fd-buttons button {
				min-width: 75px;
				height: 23px;
			}

			@media print {
				#app {
					display: none;
				}
				html,
				body,
				#print-helper {
					height: auto;
				}
				#print-helper {
					overflow: visible;
					white-space: pre-wrap;
					overflow-wrap: break-word;
				}
			}
		</style>
	</body>
</html>
